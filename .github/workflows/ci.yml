name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Be.StoryVerse.sln

      - name: Build
        run: dotnet build Be.StoryVerse.sln --no-restore --configuration Release

      # No test projects yet. Add a `dotnet test` step here once *.Tests
      # projects exist, per code-standard.md testing conventions.
