# Production compose for a single VPS. All 6 services + Postgres run on one
# private docker network; only the `edge` nginx container is published to the
# host (port 80), doing Host-header routing to each service by container
# name. Cloudflare (orange-cloud DNS, SSL/TLS mode: Flexible) terminates TLS
# for browsers and talks to this VPS over plain HTTP — no cert needed here.
#
# Usage:
#   cp .env.production.example .env.production   # fill in real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# First-time schema setup / after a migration-adding change, per service:
#   docker compose -f docker-compose.prod.yml --env-file .env.production \
#     run --rm migrate-content   # (or migrate-authentication, ...)
#
# See deploy/README.md for the per-service Dockerfile + migrate contract this
# reuses unchanged (originally written for Cloud Run; both listen on $PORT /
# take DB_ENV_VAR+DB_CONNECTION, neither is Cloud Run-specific).
#
# One-time before first `up` (Kibana has no built-in auth — this file gates
# it via nginx basic auth, see deploy/nginx.conf). Gitignored; regenerate per
# deploy, never commit the real credentials:
#   htpasswd -c deploy/kibana.htpasswd admin
#   (or without the htpasswd binary: openssl passwd -apr1 '<password>' and
#   hand-write "admin:<hash>" into deploy/kibana.htpasswd)

services:
  postgres:
    image: postgres:16
    container_name: storyverse-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - storyverse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [storyverse]

  authentication-api:
    build:
      context: .
      dockerfile: deploy/authentication/Dockerfile
    container_name: storyverse-authentication
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AuthenticationDatabase: "Host=postgres;Port=5432;Database=storyverse_authentication;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ServiceAuth__Token: ${SERVICE_AUTH_TOKEN}
      GcpSettings__AuthSettings__Issuer: Authentication.Api
      GcpSettings__AuthSettings__Audiences__0: StoryVerse.Web
      GcpSettings__AuthSettings__Audiences__1: StoryVerse.Mobile
      GcpSettings__AuthSettings__SecretKey: ${JWT_SECRET_KEY}
      GcpSettings__GoogleAuthSettings__ClientId: ${GOOGLE_CLIENT_ID}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
    networks: [storyverse]

  content-api:
    build:
      context: .
      dockerfile: deploy/content/Dockerfile
    container_name: storyverse-content
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ContentDatabase: "Host=postgres;Port=5432;Database=storyverse_content;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ServiceAuth__Token: ${SERVICE_AUTH_TOKEN}
      Services__NotificationApi__BaseUrl: http://notification-api:8080
      Services__NotificationApi__ServiceToken: ${SERVICE_AUTH_TOKEN}
      Services__AuthApi__BaseUrl: http://authentication-api:8080
      Services__AuthApi__ServiceToken: ${SERVICE_AUTH_TOKEN}
      GcpSettings__AuthSettings__Issuer: Authentication.Api
      GcpSettings__AuthSettings__Audiences__0: StoryVerse.Web
      GcpSettings__AuthSettings__Audiences__1: StoryVerse.Mobile
      GcpSettings__AuthSettings__SecretKey: ${JWT_SECRET_KEY}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
      Elasticsearch__Url: ${ELASTICSEARCH_URL}
      Elasticsearch__IndexName: ${ELASTICSEARCH_STORIES_INDEX}
      Elasticsearch__Enabled: ${ELASTICSEARCH_SEARCH_ENABLED}
      Elasticsearch__SearchReadEnabled: ${ELASTICSEARCH_SEARCH_READ_ENABLED}
      StorySearchSync__PollIntervalSeconds: ${STORY_SEARCH_SYNC_POLL_SECONDS:-60}
      Redis__Enabled: ${REDIS_ENABLED:-false}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD:-}
    networks: [storyverse]

  community-api:
    build:
      context: .
      dockerfile: deploy/community/Dockerfile
    container_name: storyverse-community
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__CommunityDatabase: "Host=postgres;Port=5432;Database=storyverse_community;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ServiceAuth__Token: ${SERVICE_AUTH_TOKEN}
      Services__AuthApi__BaseUrl: http://authentication-api:8080
      Services__AuthApi__ServiceToken: ${SERVICE_AUTH_TOKEN}
      Services__ContentApi__BaseUrl: http://content-api:8080
      Services__ContentApi__ServiceToken: ${SERVICE_AUTH_TOKEN}
      GcpSettings__AuthSettings__Issuer: Authentication.Api
      GcpSettings__AuthSettings__Audiences__0: StoryVerse.Web
      GcpSettings__AuthSettings__Audiences__1: StoryVerse.Mobile
      GcpSettings__AuthSettings__SecretKey: ${JWT_SECRET_KEY}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
    networks: [storyverse]

  library-api:
    build:
      context: .
      dockerfile: deploy/library/Dockerfile
    container_name: storyverse-library
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__LibraryDatabase: "Host=postgres;Port=5432;Database=storyverse_library;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      GcpSettings__AuthSettings__Issuer: Authentication.Api
      GcpSettings__AuthSettings__Audiences__0: StoryVerse.Web
      GcpSettings__AuthSettings__Audiences__1: StoryVerse.Mobile
      GcpSettings__AuthSettings__SecretKey: ${JWT_SECRET_KEY}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
    networks: [storyverse]

  moderation-api:
    build:
      context: .
      dockerfile: deploy/moderation/Dockerfile
    container_name: storyverse-moderation
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ModerationDatabase: "Host=postgres;Port=5432;Database=storyverse_moderation;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Services__ContentApi__BaseUrl: http://content-api:8080
      Services__ContentApi__ServiceToken: ${SERVICE_AUTH_TOKEN}
      Services__CommunityApi__BaseUrl: http://community-api:8080
      Services__CommunityApi__ServiceToken: ${SERVICE_AUTH_TOKEN}
      Services__AuthApi__BaseUrl: http://authentication-api:8080
      Services__AuthApi__ServiceToken: ${SERVICE_AUTH_TOKEN}
      GcpSettings__AuthSettings__Issuer: Authentication.Api
      GcpSettings__AuthSettings__Audiences__0: StoryVerse.Web
      GcpSettings__AuthSettings__Audiences__1: StoryVerse.Mobile
      GcpSettings__AuthSettings__SecretKey: ${JWT_SECRET_KEY}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
    networks: [storyverse]

  notification-api:
    build:
      context: .
      dockerfile: deploy/notification/Dockerfile
    container_name: storyverse-notification
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__NotificationDatabase: "Host=postgres;Port=5432;Database=storyverse_notification;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ServiceAuth__Token: ${SERVICE_AUTH_TOKEN}
      GcpSettings__AuthSettings__Issuer: Authentication.Api
      GcpSettings__AuthSettings__Audiences__0: StoryVerse.Web
      GcpSettings__AuthSettings__Audiences__1: StoryVerse.Mobile
      GcpSettings__AuthSettings__SecretKey: ${JWT_SECRET_KEY}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
    networks: [storyverse]

  # The only container with a host port. Cloudflare's 6 proxied A records
  # (svc-<service>.truyenmacanh3.com -> this VPS's IP) all land here; nginx
  # routes each by Host header to the right service container.
  edge:
    image: nginx:alpine
    container_name: storyverse-edge
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/kibana.htpasswd:/etc/nginx/kibana.htpasswd:ro
    depends_on:
      - authentication-api
      - content-api
      - community-api
      - library-api
      - moderation-api
      - notification-api
      - kibana
    networks: [storyverse]

  # Story search + centralized service logs. Single-node, no auth
  # (xpack.security.enabled=false) since it's only reachable on the internal
  # `storyverse` network — never publish 9200 to the host or Cloudflare.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: storyverse-elasticsearch
    restart: unless-stopped
    environment:
      - node.name=es01
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1200m
    volumes:
      - storyverse-esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [storyverse]

  # Redis — write buffer + daily counters for view tracking (content-api). Internal-only:
  # no published port, password required. AOF (everysec) survives restarts losing <=1s of
  # counts; noeviction so a full instance rejects writes (content-api then falls back to
  # direct Postgres increments) instead of silently evicting counters.
  redis:
    image: redis:7-alpine
    container_name: storyverse-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 100mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    mem_limit: 128m
    volumes:
      - storyverse-redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [storyverse]

  # Kibana UI — exposed only via the `edge` nginx route with basic auth, see
  # deploy/nginx.conf. Never publish 5601 to the host directly.
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: storyverse-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # 700m was too tight — Kibana 8.15's default plugin set (166 plugins)
      # OOM-crashed on startup/first page load. Cap the Node heap explicitly
      # a bit below mem_limit so V8 respects the container ceiling instead of
      # sizing itself off host RAM and getting OOM-killed by the cgroup.
      - NODE_OPTIONS=--max-old-space-size=1200
    mem_limit: 1536m
    networks: [storyverse]

  # Ships all 6 services' container logs (Docker's default json-file driver)
  # into Elasticsearch. No app-code changes required for this to work.
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: storyverse-filebeat
    restart: unless-stopped
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./deploy/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 200m
    networks: [storyverse]

  # One-shot migration runners. Not started by `up`; run explicitly:
  #   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrate-content
  migrate-authentication:
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
      args:
        INFRA_PROJECT: src/Services/Authentications/Authentication.Infrastructure
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_ENV_VAR: AUTH_DB_CONNECTION
      DB_CONNECTION: "Host=postgres;Port=5432;Database=storyverse_authentication;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    networks: [storyverse]

  migrate-content:
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
      args:
        INFRA_PROJECT: src/Services/Contents/Content.Infrastructure
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_ENV_VAR: CONTENT_DB_CONNECTION
      DB_CONNECTION: "Host=postgres;Port=5432;Database=storyverse_content;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    networks: [storyverse]

  migrate-community:
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
      args:
        INFRA_PROJECT: src/Services/Communities/Community.Infrastructure
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_ENV_VAR: COMMUNITY_DB_CONNECTION
      DB_CONNECTION: "Host=postgres;Port=5432;Database=storyverse_community;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    networks: [storyverse]

  migrate-library:
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
      args:
        INFRA_PROJECT: src/Services/Libraries/Library.Infrastructure
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_ENV_VAR: LIBRARY_DB_CONNECTION
      DB_CONNECTION: "Host=postgres;Port=5432;Database=storyverse_library;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    networks: [storyverse]

  migrate-moderation:
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
      args:
        INFRA_PROJECT: src/Services/Moderations/Moderation.Infrastructure
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_ENV_VAR: MODERATION_DB_CONNECTION
      DB_CONNECTION: "Host=postgres;Port=5432;Database=storyverse_moderation;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    networks: [storyverse]

  migrate-notification:
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
      args:
        INFRA_PROJECT: src/Services/Notifications/Notification.Infrastructure
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_ENV_VAR: NOTIFICATION_DB_CONNECTION
      DB_CONNECTION: "Host=postgres;Port=5432;Database=storyverse_notification;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    networks: [storyverse]

networks:
  storyverse:

volumes:
  storyverse-pgdata:
  storyverse-esdata:
  storyverse-redisdata:
