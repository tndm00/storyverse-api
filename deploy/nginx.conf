# Host-header routing so all 6 services can share port 80 on the VPS behind
# Cloudflare's proxy (orange-cloud DNS records all pointing at the same VPS
# IP). Cloudflare terminates TLS at the edge (SSL/TLS mode: Flexible) and
# talks to this container over plain HTTP — that's why every upstream here is
# plain http://<service>:8080, not https.
#
# `proxy_pass http://literal-name:8080` resolves the container name ONCE at
# nginx startup and never again — restarting a backend service (which gets a
# new container IP) then leaves nginx pointing at a dead/reassigned IP until
# nginx itself is restarted. Using a variable in proxy_pass with an explicit
# `resolver` forces nginx to re-resolve via Docker's embedded DNS (127.0.0.11)
# on every request (subject to the DNS TTL), so a backend restart never needs
# an edge restart too.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name svc-authentication.truyenmacanh3.com;
    location / {
        set $upstream authentication-api:8080;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

